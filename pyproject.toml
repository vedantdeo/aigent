[project]
name = "aigent"
version = "0.1.0"
description = "aigent: a personal AI agent, built one capability at a time."
readme = "README.md"
authors = [
    { name = "vedantdeo", email = "vedantdeo1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "httpx2>=2.12.0",
    "openai>=3.19.0",
    "pydantic>=2.13.5",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
aigent = "aigent.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
adk = [
    "google-adk>=2.10.0",
]
compare = [
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
graph = [
    "langgraph>=1.2.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: spends real API credits; run explicitly with `uv run pytest -m live`"]
addopts = "-m 'not live'"
