<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a ledger of fact cards, each pairing the filed XBRL figure with the printed page it was matched on. */
:root {
  --bg: #f5f6f3; --surface: #ffffff; --ink: #1d2422; --muted: #5d6965; --rule: #d8ddd8;
  --accent: #19645c; --accent-soft: #e2efec;
  --right: #1f7a3d; --right-soft: #e3f2e7; --wrong: #b3261e; --wrong-soft: #fae5e3; --unsure: #9a6a00; --unsure-soft: #fbf0d6;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121615; --surface: #1a201e; --ink: #e5eae7; --muted: #9aa7a2; --rule: #2e3734;
  --accent: #5fc2b4; --accent-soft: #1d3330;
  --right: #6fcf8c; --right-soft: #1b3324; --wrong: #f08a82; --wrong-soft: #3a1f1d; --unsure: #e6b84d; --unsure-soft: #382d14; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121615; --surface: #1a201e; --ink: #e5eae7; --muted: #9aa7a2; --rule: #2e3734;
  --accent: #5fc2b4; --accent-soft: #1d3330;
  --right: #6fcf8c; --right-soft: #1b3324; --wrong: #f08a82; --wrong-soft: #3a1f1d; --unsure: #e6b84d; --unsure-soft: #382d14; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px; display: grid; gap: 22px; }
header { display: grid; gap: 10px; }
h1 { font: 650 clamp(1.6rem, 3.2vw, 2.2rem)/1.15 var(--display); margin: 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 68ch; margin: 0; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.chip { font: 600 12px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.chip.right { background: var(--right-soft); color: var(--right); } .chip.wrong { background: var(--wrong-soft); color: var(--wrong); } .chip.unsure { background: var(--unsure-soft); color: var(--unsure); }
.status { color: var(--muted); font-size: 13px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button, .verdicts button { font: 500 14px var(--body); border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); overflow: hidden; }
.card.marked-right { box-shadow: inset 4px 0 0 var(--right); } .card.marked-wrong { box-shadow: inset 4px 0 0 var(--wrong); } .card.marked-unsure { box-shadow: inset 4px 0 0 var(--unsure); }
@media (max-width: 760px) { .card { grid-template-columns: minmax(0, 1fr); } }
.facts { padding: 18px; display: grid; gap: 14px; align-content: start; border-right: 1px solid var(--rule); min-width: 0; }
@media (max-width: 760px) { .facts { border-right: 0; border-bottom: 1px solid var(--rule); } }
.top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.id { font: 600 12px var(--mono); color: var(--muted); }
.kind { font: 600 11px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.co { font: 650 1.15rem/1.2 var(--display); margin: 0; }
.concept { font: 13px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; margin: 0; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14px; }
dt { color: var(--muted); } dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.fig { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; }
.row { font-style: italic; }
.verdicts { display: flex; gap: 8px; flex-wrap: wrap; }
.verdicts button[data-v="right"][aria-pressed="true"] { background: var(--right-soft); border-color: var(--right); color: var(--right); }
.verdicts button[data-v="wrong"][aria-pressed="true"] { background: var(--wrong-soft); border-color: var(--wrong); color: var(--wrong); }
.verdicts button[data-v="unsure"][aria-pressed="true"] { background: var(--unsure-soft); border-color: var(--unsure); color: var(--unsure); }
textarea { width: 100%; box-sizing: border-box; min-height: 58px; font: 14px/1.4 var(--body); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--ink); resize: vertical; }
.saved { font-size: 12px; color: var(--muted); min-height: 1em; }
.page { min-width: 0; background: var(--bg); }
.page .scroll { max-height: 640px; overflow: auto; }
.page img { display: block; width: 100%; height: auto; background: #fff; }
.page .noimg { padding: 18px; color: var(--muted); }
.page .bar { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.page .bar a { color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .15s ease; } }

.trace { grid-column: 1 / -1; border-top: 1px solid var(--rule); }
.trace > summary { cursor: pointer; padding: 10px 18px; font: 600 13px var(--body); color: var(--accent); list-style-position: inside; }
.trace > summary .meta { color: var(--muted); font-weight: 400; margin-left: 6px; }
.trace .inner { padding: 0 18px 18px; display: grid; gap: 12px; min-width: 0; }
.trace .facts-line { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.trace .facts-line b { color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { font: 500 13px var(--body); border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.grid-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; }
table.t { border-collapse: collapse; font: 12px/1.4 var(--mono); width: max-content; min-width: 100%; }
table.t th, table.t td { border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); padding: 4px 8px; vertical-align: top; text-align: left; max-width: 340px; overflow-wrap: anywhere; }
table.t th { background: var(--bg); color: var(--muted); font-weight: 600; position: sticky; top: 0; }
table.t td.n { color: var(--muted); text-align: right; }
table.t td.empty::after { content: "·"; color: var(--rule); }
table.t tr.hdr td { background: var(--bg); }
table.t tr.hit td { background: var(--accent-soft); }
table.t td.cell-hit { outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 600; }
table.t tr.gap td { text-align: center; color: var(--muted); }
.tag { display: inline-block; font: 600 10px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 3px 5px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--rule); margin-right: 4px; }
.tag.on { color: var(--accent); border-color: var(--accent); }
.legend { font-size: 12px; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <h1>{{HEADING}}</h1>
    <p class="lede">{{LEDE}}</p>
    <div class="tally" id="tally"></div>
    <div class="status" id="status">Connecting to the marks store…</div>
    <div class="filters" role="group" aria-label="Show">
      <button id="f-all" aria-pressed="true">All</button>
      <button id="f-open" aria-pressed="false">Not yet marked</button>
      <button id="f-flag" aria-pressed="false">Wrong or unsure</button>
      <button id="f-new" aria-pressed="false">Latest batch</button>
    </div>
  </header>
  <main id="cards" class="wrap" style="padding:0"></main>
</div>

<script type="application/json" id="data">{{DATA}}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const LATEST = Math.max(0, ...DATA.map(r => r.batch));
const marks = {};
let db = null, filter = "all";
const $ = (s, r = document) => r.querySelector(s);
const indian = (n, digits) => n.toLocaleString("en-IN", { minimumFractionDigits: digits, maximumFractionDigits: digits });
function xbrl(r) {
  if (r.per_share) return "₹ " + indian(r.value, 2) + " per share";
  if (r.unit === "pure") return indian(r.value, 4) + " (a ratio)";
  if (r.unit === "INR") return "₹ " + indian(r.value / 1e7, 2) + " crore";
  return indian(r.value, 2) + " " + r.unit;
}
function period(r) { return r.period_start ? `${r.period_start} to ${r.period_end}` : `balance at ${r.period_end}`; }

const SCALES = { 10000000: "₹ crore", 100000: "₹ lakh", 1000000: "million" };
const RULES = { label: "the row's label names the fact", distinct: "the figure is distinctive on its own", "per-share": "a per-share row under its heading" };
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function tag(text, on) { return el("span", "tag" + (on ? " on" : ""), text); }
function gridOf(t, cols, rowCells) {
  const wrap = el("div", "grid-wrap"), table = el("table", "t");
  const head = el("tr"); for (const c of cols) head.append(el("th", null, c)); const thead = el("thead"); thead.append(head); table.append(thead);
  const body = el("tbody"); let last = null;
  for (const r of t.rows) {
    if (last != null && r.row > last + 1) { const g = el("tr", "gap"); const td = el("td", null, `… rows ${last + 1}–${r.row - 1} not shown`); td.colSpan = cols.length; g.append(td); body.append(g); }
    const tr = el("tr", r.row === t.row ? "hit" : (r.row < t.header ? "hdr" : ""));
    tr.append(el("td", "n", String(r.row)));
    for (const td of rowCells(r)) tr.append(td);
    body.append(tr); last = r.row;
  }
  table.append(body); wrap.append(table); return wrap;
}
function doclingView(t) {
  const width = Math.max(...t.rows.map(r => r.cells.length));
  const cols = ["row", "flags", ...Array.from({ length: width }, (_, j) => t.columns[j] ? `col ${j} · ${t.columns[j]}` : `col ${j}`)];
  return gridOf(t, cols, r => {
    const flags = el("td"); if (r.docling_header) flags.append(tag("header", true)); if (r.section) flags.append(tag("section", true));
    const out = [flags];
    for (let j = 0; j < width; j++) {
      const v = r.cells[j] ?? "";
      const td = el("td", v ? "" : "empty", v || null);
      if (r.row === t.row && j === t.column) td.classList.add("cell-hit");
      out.push(td);
    }
    return out;
  });
}
function readView(t) {
  return gridOf(t, ["row", "read as", "its own words", "label its figures carry", "under heading", "block"], r => {
    if (!r.read) { const td = el("td", null, r.row < t.header ? "header row: dates and scale read from here" : "not read"); td.colSpan = 5; return [td]; }
    const x = r.read;
    const kind = el("td"); kind.append(tag(x.kind, x.kind !== "figures"));
    const named = el("td", x.named ? "" : "empty", x.named || null);
    if (x.named && x.named !== x.label) named.append(" ", tag("from heading", true));
    return [kind, el("td", x.label ? "" : "empty", x.label || null), named, el("td", x.heading ? "" : "empty", x.heading || null), el("td", "n", String(x.block))];
  });
}
function tracePanel(r) {
  const t = r.trace, d = el("details", "trace");
  const s = el("summary", null, "How it was read");
  if (!t || t.error) { s.append(el("span", "meta", t ? t.error : "no trace for this card")); d.append(s); return d; }
  s.append(el("span", "meta", `table ${t.sheet}, row ${t.row}, column ${t.column} · agreed because ${RULES[t.rule] ?? "—"} · label share ${t.share ?? "—"}`));
  d.append(s);
  const inner = el("div", "inner");
  const line = el("div", "facts-line");
  for (const [k, v] of [["Basis", t.basis ?? "not read"], ["Scale", t.scale ? (SCALES[t.scale] ?? t.scale) : "not read"], ["Header rows", String(t.header)], ["Page", String(t.page)], ["Cell", t.printed]]) {
    const span = el("span", null, k + " "); span.append(el("b", null, v)); line.append(span);
  }
  const tabs = el("div", "tabs"); tabs.setAttribute("role", "tablist");
  const views = [["Docling's table", doclingView(t)], ["Cross-check's reading", readView(t)]];
  const holder = el("div");
  const legend = el("p", "legend");
  const legends = ["Cells exactly as Docling parsed them (an empty cell shows ·). Shaded rows were taken as header by the cross-check; the outlined cell is the figure matched. Flags are Docling's own marks.",
                   "How the cross-check read each row below the header: its kind (a heading has no figures; a main line, as IX or D., opens a block), the label its figures carry (a block's first unlabelled row takes its heading), and its block."];
  views.forEach(([name, view], i) => {
    const b = el("button", null, name); b.setAttribute("role", "tab");
    b.addEventListener("click", () => { for (const x of tabs.children) x.setAttribute("aria-selected", String(x === b)); holder.replaceChildren(view); legend.textContent = legends[i]; });
    tabs.append(b);
  });
  inner.append(line, tabs, legend, holder); d.append(inner);
  d.addEventListener("toggle", () => { if (d.open && !holder.firstChild) tabs.children[0].click(); }, { once: true });
  return d;
}
function gone(r) {
  const el = document.createElement("article"); el.className = "card"; el.id = r.id;
  const p = document.createElement("div"); p.className = "facts";
  p.innerHTML = `<div class="top"><span class="kind"></span><span class="id"></span></div><p class="hint"></p><div class="verdicts" hidden></div><textarea hidden></textarea>`;
  $(".kind", p).textContent = r.kind; $(".id", p).textContent = r.id;
  $(".hint", p).textContent = `Fact ${r.fact_id} in ${r.document}: ${r.note}. Its old mark is kept.`;
  el.append(p); return el;
}
function card(r) {
  if (r.note === "not in this run") return gone(r);
  const el = document.createElement("article");
  el.className = "card"; el.id = r.id;
  const facts = document.createElement("div"); facts.className = "facts";
  facts.innerHTML = `<div class="top"><span class="kind"></span><span class="id"></span></div>
    <h2 class="co"></h2><p class="concept"></p>
    <dl><dt>XBRL says</dt><dd class="fig x"></dd><dt>Period</dt><dd class="p"></dd><dt>Basis</dt><dd class="b"></dd>
    <dt>Printed</dt><dd class="fig pr"></dd><dt class="dv" hidden>Reads as</dt><dd class="fig dv" hidden></dd><dt>On the row</dt><dd class="row rw"></dd><dt>Read from</dt><dd class="st"></dd></dl>
    <div class="verdicts" role="group" aria-label="Verdict">
      <button data-v="right" aria-pressed="false">Right</button><button data-v="wrong" aria-pressed="false">Wrong</button><button data-v="unsure" aria-pressed="false">Unsure</button>
    </div>
    <label class="hint" for="note-${r.id}">Note (optional)</label>
    <textarea id="note-${r.id}" placeholder="What is off, or where it is printed"></textarea>
    <div class="saved" aria-live="polite"></div>`;
  $(".kind", facts).textContent = r.kind; $(".id", facts).textContent = r.id;
  $(".co", facts).textContent = r.ticker; $(".concept", facts).textContent = r.concept + (r.segment ? ` · ${r.segment}` : "");
  $(".x", facts).textContent = xbrl(r); $(".p", facts).textContent = period(r); $(".b", facts).textContent = r.basis;
  $(".pr", facts).textContent = r.printed; $(".rw", facts).textContent = r.row || "(no row label read)";
  $(".st", facts).textContent = r.stamp;
  if (r.outcome === "differ" && r.printed_value != null) {
    for (const x of facts.querySelectorAll(".dv")) x.hidden = false;
    $("dd.dv", facts).textContent = xbrl({ ...r, value: r.printed_value }) + ` (off by ${xbrl({ ...r, value: r.printed_value - r.value })})`;
  }
  if (r.note) { const n = document.createElement("p"); n.className = "hint"; n.textContent = "Note: " + r.note; $(".concept", facts).after(n); }
  for (const b of facts.querySelectorAll(".verdicts button")) b.addEventListener("click", () => mark(r.id, b.dataset.v));
  const note = $("textarea", facts);
  note.addEventListener("change", () => mark(r.id, marks[r.id]?.verdict ?? null, note.value));
  const page = document.createElement("div"); page.className = "page";
  const where = `${r.document.split("/")[1].replace("#rapidocr", "")}${r.page ? `, page ${r.page}` : ""}`;
  page.innerHTML = `<div class="bar"><span></span><a target="_blank" rel="noopener">Filed document ↗</a></div>`;
  $(".bar span", page).textContent = where;
  const link = $("a", page); if (r.url) link.href = r.url; else link.remove();
  if (r.image) { const box = document.createElement("div"); box.className = "scroll"; const img = new Image(); img.src = r.image; img.alt = `${where} as filed`; img.loading = "lazy"; box.append(img); page.append(box); }
  else { const p = document.createElement("p"); p.className = "noimg"; p.textContent = "An HTML filing with no pages: use the filed document link and search for the printed figure."; page.append(p); }
  el.append(facts, page, tracePanel(r));
  return el;
}
function paint() {
  for (const r of DATA) {
    const el = document.getElementById(r.id), m = marks[r.id];
    el.classList.remove("marked-right", "marked-wrong", "marked-unsure");
    if (m?.verdict) el.classList.add("marked-" + m.verdict);
    for (const b of el.querySelectorAll(".verdicts button")) b.setAttribute("aria-pressed", String(m?.verdict === b.dataset.v));
    const note = $("textarea", el); if (document.activeElement !== note) note.value = m?.note ?? "";
    const show = filter === "all" || (filter === "open" && !m?.verdict) || (filter === "flag" && (m?.verdict === "wrong" || m?.verdict === "unsure")) || (filter === "new" && r.batch === LATEST);
    el.hidden = !show;
  }
  const c = { right: 0, wrong: 0, unsure: 0 };
  for (const m of Object.values(marks)) if (m.verdict) c[m.verdict]++;
  const done = c.right + c.wrong + c.unsure;
  const t = $("#tally"); t.replaceChildren();
  for (const [cls, text] of [["", `${done} of ${DATA.length} marked`], ["right", `${c.right} right`], ["wrong", `${c.wrong} wrong`], ["unsure", `${c.unsure} unsure`]]) {
    const s = document.createElement("span"); s.className = "chip " + cls; s.textContent = text; t.append(s);
  }
}
async function mark(id, verdict, note) {
  const prev = marks[id] ?? {};
  const next = { verdict, note: note ?? prev.note ?? "", at: new Date().toISOString() };
  marks[id] = next; paint();
  const saved = $(`#${id} .saved`);
  if (!db) { saved.textContent = "Not saved: the marks store is not available in this view."; return; }
  try { await db.doc("marks/" + id).set(next); saved.textContent = "Saved"; }
  catch (e) { saved.textContent = "Not saved: " + (e?.message || "the store refused it") + ". Try again."; }
}
for (const [id, f] of [["f-all", "all"], ["f-open", "open"], ["f-flag", "flag"], ["f-new", "new"]]) $("#" + id).addEventListener("click", () => {
  filter = f; for (const b of document.querySelectorAll(".filters button")) b.setAttribute("aria-pressed", String(b.id === id)); paint();
});
$("#cards").append(...DATA.map(card));
paint();
(async () => {
  const status = $("#status");
  const timer = setTimeout(() => { status.textContent = "The marks store did not answer. Marks will not be saved; reload to try again."; }, 10000);
  db = window.claude?.use ? await window.claude.use("db") : null;
  if (!db) { clearTimeout(timer); status.textContent = "Marks cannot be saved here: open this page on claude.ai while signed in."; return; }
  db.collection("marks").onSnapshot(snap => {
    clearTimeout(timer);
    for (const d of snap.docs) marks[d.id] = d.data();
    status.textContent = "Marks save as you go and are read back by Claude.";
    paint();
  }, e => { clearTimeout(timer); status.textContent = "Could not load saved marks: " + (e?.message || "unknown error"); });
})();
</script>
