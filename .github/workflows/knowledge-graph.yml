# The same rule the local pre-commit hook enforces, for anyone who never ran
# `git config core.hooksPath .githooks` — or who reached for --no-verify.
name: knowledge graph

on:
  push:
    branches: [main]
  pull_request:

jobs:
  in-sync:
    name: graph moves with the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare the change against docs/knowledge-graph.md
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
            # A new branch, or a force push, reports an all-zero "before".
            case "$base" in
              0000000000000000000000000000000000000000|"")
                base="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)" ;;
            esac
          fi

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No comparable base commit — nothing to check."
            exit 0
          fi

          echo "Comparing $base...$HEAD_SHA"
          sh scripts/check-knowledge-graph.sh ci "$base" "$HEAD_SHA"

      # Pinned to a full version on purpose, as in checks.yml.
      - uses: astral-sh/setup-uv@v10.1.0

      # Standard library only, so no project install: the contents, At: lines and import edges are
      # current, every node names something that exists, and no layering rule is broken.
      - name: Check the graph's generated parts and rules
        run: uv run --no-project --python 3.12 python scripts/graph_doc.py
