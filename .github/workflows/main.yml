# The mains CI: aigent's main against underhood's main as it is when the run starts. underhood's own
# mains CI starts this after a green push.
name: mains

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mains:
    uses: ./.github/workflows/checks.yml
    with:
      underhood: main
    secrets: inherit

