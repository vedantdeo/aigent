# The mains CI: aigent's main against underhood's and cltrplusf's mains as they are when the run
# starts. Each of their own mains CIs starts this after a green push.
name: mains

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mains:
    uses: ./.github/workflows/checks.yml
    with:
      underhood: main
      cltrplusf: main
    secrets: inherit

