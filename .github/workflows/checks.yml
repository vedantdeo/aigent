# The README's checks, shared by the mains CI (main.yml) and release.yml's roll.
# No API key is configured here on purpose: tests/test_api_smoke.py skips itself without
# credentials, and the paid tests are deselected by `-m 'not live'`. CI therefore spends nothing.
name: checks

on:
  workflow_call:
    inputs:
      ref:
        description: the commit to check, instead of the one that started the run
        type: string
        default: ""
      underhood:
        description: an underhood ref to test against instead of the one uv.lock pins
        type: string
        default: ""

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      # A saved checkout token would override UNDERHOOD_TOKEN and 403 the underhood clone.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Pinned to a full version on purpose: setup-uv stopped publishing floating
      # major and minor tags at v8, so `@v10` does not exist and would fail the
      # run. Bump this deliberately; do not "tidy" it into a shorter tag.
      #
      # enable-cache is set explicitly rather than left at the v10 default of
      # `auto`, which disables the cache for release and workflow_run events.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # underhood is a private repo that uv clones for its GPU pricing. UNDERHOOD_TOKEN is a
      # fine-grained token with read-only Contents access to it, stored as a repo secret.
      - name: Let git reach underhood
        run: >-
          git config --global
          url."https://x-access-token:${{ secrets.UNDERHOOD_TOKEN }}@github.com/vedantdeo/underhood".insteadOf
          "https://github.com/vedantdeo/underhood"

      # --locked fails if uv.lock has drifted from pyproject.toml, which is a
      # bug worth catching on its own. The `compare` group carries LangChain for
      # the framework comparison, `graph` carries LangGraph, and `adk` Google's ADK,
      # for Project 2's builds: none is a runtime dependency, but their modules
      # live in src/ and a file nobody typechecks is a file that rots.
      - name: Install the locked environment
        run: uv sync --locked --group compare --group graph --group adk

      # Every later step runs with --no-sync, which would otherwise put the locked underhood back.
      - name: Swap in underhood ${{ inputs.underhood }}
        if: inputs.underhood != ''
        env:
          REF: ${{ inputs.underhood }}
        run: |
          uv pip install --no-deps --reinstall "underhood @ git+https://github.com/vedantdeo/underhood@$REF"
          echo "checking against underhood $REF"

      # Each check reports its own status rather than hiding behind the first
      # failure, so one red run tells you everything that is wrong.
      - name: ruff · lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff · format
        if: ${{ !cancelled() }}
        run: uv run --no-sync ruff format --check .

      - name: pyright
        if: ${{ !cancelled() }}
        run: uv run --no-sync pyright

      - name: pytest · free tests only
        if: ${{ !cancelled() }}
        run: uv run --no-sync pytest -q
