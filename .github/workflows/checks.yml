# The commands from the README's Checks section, on every push and PR.
# No API key is configured here on purpose: tests/test_api_smoke.py skips itself
# without credentials, and the paid tests are deselected by `-m 'not live'` in
# pyproject.toml. CI therefore spends nothing.
name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version on purpose: setup-uv stopped publishing floating
      # major and minor tags at v8, so `@v10` does not exist and would fail the
      # run. Bump this deliberately; do not "tidy" it into a shorter tag.
      #
      # enable-cache is set explicitly rather than left at the v10 default of
      # `auto`, which disables the cache for release and workflow_run events.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --locked fails if uv.lock has drifted from pyproject.toml, which is a
      # bug worth catching on its own. The `compare` group carries LangChain for
      # the framework comparison: it is not a runtime dependency, but its module
      # lives in src/ and a file nobody typechecks is a file that rots.
      - name: Install the locked environment
        run: uv sync --locked --group compare

      # Each check reports its own status rather than hiding behind the first
      # failure, so one red run tells you everything that is wrong.
      - name: ruff · lint
        run: uv run ruff check --output-format=github .

      - name: ruff · format
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: pyright
        if: ${{ !cancelled() }}
        run: uv run pyright

      - name: pytest · free tests only
        if: ${{ !cancelled() }}
        run: uv run pytest -q
