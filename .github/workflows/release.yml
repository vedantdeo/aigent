# Snap and roll both repos as a pair, Mon and Thu 00:07 IST. snap branches both mains as snap-DATE,
# aigent's re-pinned to underhood's snap; roll runs each repo's checks on its snap; if both pass,
# stable tags both snaps roll-DATE, the day they rolled, and stable. All or nothing. main is left
# pinned to underhood's main.
# UNDERHOOD_TOKEN: fine-grained, underhood only, Contents read and write.
name: release

on:
  schedule:
    - cron: "37 18 * * 0,3" # Mon and Thu 00:07 IST: an odd minute, clear of the busy :30
  workflow_dispatch:
    inputs:
      step:
        description: snap then roll, roll the latest snaps again, or repin aigent's snap to underhood's then roll
        type: choice
        options: [snap, roll, repin]
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UNDERHOOD: https://github.com/vedantdeo/underhood
  KEEP: 8 # snap branches kept in each repo: a month of them

jobs:
  snap:
    name: snap
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.snap.outputs.branch }}
      aigent: ${{ steps.snap.outputs.aigent }}
      underhood: ${{ steps.snap.outputs.underhood }}
    steps:
      # Without persisted credentials, the job's token cannot shadow UNDERHOOD_TOKEN.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Let git reach underhood, and push here
        env:
          UNDERHOOD_TOKEN: ${{ secrets.UNDERHOOD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: .github/release/setup-git.sh

      - name: Snap both mains, find the latest snaps, or repin aigent's
        id: snap
        env:
          STEP: ${{ inputs.step || 'snap' }}
        run: |
          case "$STEP" in
            snap)
              branch="snap-$(TZ=Asia/Kolkata date +%F)"
              git fetch -q "$UNDERHOOD" main
              under=$(git rev-parse FETCH_HEAD)
              git push -f "$UNDERHOOD" "$under:refs/heads/$branch"
              git checkout -B "$branch" origin/main
              pinned=$(.github/release/pin-underhood.sh "branch = \"$branch\"")
              if [ "$pinned" != "$under" ]; then
                echo "::error::locked underhood $pinned, not its $branch head $under"
                exit 1
              fi
              git commit -am "Point underhood at its $branch"
              git push -f "$AIGENT" "$branch"
              echo "snapped underhood at $under and aigent, pinned to it, as $branch"
              for repo in "$UNDERHOOD" "$AIGENT"; do
                git ls-remote --heads "$repo" 'snap-*' | sed 's|.*refs/heads/||' | sort | head -n "-$KEEP" |
                  while read -r old; do git push "$repo" --delete "$old"; echo "pruned $old"; done
              done
              ;;
            roll)
              branch=$(git ls-remote --heads "$AIGENT" 'snap-*' | sed 's|.*refs/heads/||' | sort | tail -n 1)
              echo "rolling $branch again"
              ;;
            repin)
              branch=$(git ls-remote --heads "$AIGENT" 'snap-*' | sed 's|.*refs/heads/||' | sort | tail -n 1)
              git checkout -B "$branch" "origin/$branch"
              uv lock --upgrade-package underhood
              if git diff --quiet uv.lock; then
                echo "$branch already pins its underhood snap's head"
              else
                git commit -m "Re-pin underhood to its $branch head" uv.lock
                git push "$AIGENT" "$branch"
              fi
              ;;
          esac
          aigent=$(git ls-remote "$AIGENT" "refs/heads/$branch" | cut -f1)
          git fetch -q "$AIGENT" "$aigent"
          under=$(git show "$aigent:uv.lock" | .github/release/pinned-underhood.sh)
          [ -n "$under" ] || { echo "::error::$branch pins no underhood commit"; exit 1; }
          echo "the pair: aigent $aigent, underhood $under"
          {
            echo "branch=$branch"
            echo "aigent=$aigent"
            echo "underhood=$under"
          } >> "$GITHUB_OUTPUT"

  # A reusable workflow's ref cannot be an expression, so underhood's checks run as of its main.
  roll-underhood:
    name: roll underhood
    needs: snap
    uses: vedantdeo/underhood/.github/workflows/checks.yml@main
    with:
      ref: ${{ needs.snap.outputs.underhood }}
    secrets:
      token: ${{ secrets.UNDERHOOD_TOKEN }}

  roll-aigent:
    name: roll aigent
    needs: snap
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.snap.outputs.aigent }}
    secrets: inherit

  stable:
    name: tag both roll-DATE and stable
    needs: [snap, roll-underhood, roll-aigent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Let git reach underhood, and push here
        env:
          UNDERHOOD_TOKEN: ${{ secrets.UNDERHOOD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: .github/release/setup-git.sh

      - name: Tag the pair that passed
        env:
          BRANCH: ${{ needs.snap.outputs.branch }}
          AIGENT_SHA: ${{ needs.snap.outputs.aigent }}
          UNDERHOOD_SHA: ${{ needs.snap.outputs.underhood }}
        run: |
          tag="roll-$(TZ=Asia/Kolkata date +%F)"
          git fetch -q "$UNDERHOOD" "$UNDERHOOD_SHA"
          git fetch -q "$AIGENT" "$AIGENT_SHA"
          git push -f "$UNDERHOOD" "$UNDERHOOD_SHA:refs/tags/$tag" "$UNDERHOOD_SHA:refs/tags/stable"
          git push -f "$AIGENT" "$AIGENT_SHA:refs/tags/$tag" "$AIGENT_SHA:refs/tags/stable"
          echo "rolled $BRANCH: underhood $UNDERHOOD_SHA and aigent $AIGENT_SHA as $tag, now stable"
