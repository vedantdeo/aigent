# Snap and roll in step with underhood, twice a week, in IST. A snap points main at underhood's
# snap-DATE branch and branches main as snap-DATE; a roll points main back at underhood's `stable`
# tag and, if CI passed and underhood rolled the commit pinned, tags the snap roll-DATE and stable.
name: snap and roll

on:
  schedule:
    - cron: "30 18 * * 0" # snap, Mon 00:00 IST
    - cron: "30 18 * * 1" # roll, Tue 00:00 IST
    - cron: "30 18 * * 3" # snap, Thu 00:00 IST
    - cron: "30 18 * * 4" # roll, Fri 00:00 IST
  workflow_dispatch:
    inputs:
      step:
        description: which step to run now
        type: choice
        options: [snap, roll, repin]
        required: true

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UNDERHOOD: https://github.com/vedantdeo/underhood
  KEEP: 8 # snap branches kept: a month of them

jobs:
  release:
    name: snap, roll or repin
    runs-on: ubuntu-latest
    steps:
      # Without persisted credentials, the job's token cannot shadow UNDERHOOD_TOKEN below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Let git reach underhood, and push here
        env:
          UNDERHOOD_TOKEN: ${{ secrets.UNDERHOOD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${UNDERHOOD_TOKEN}@github.com/vedantdeo/underhood".insteadOf "$UNDERHOOD"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "AIGENT=https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Decide the step and the date
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.step }}
        run: |
          case "$SCHEDULE" in
            "30 18 * * 0"|"30 18 * * 3") step=snap ;;
            "30 18 * * 1"|"30 18 * * 4") step=roll ;;
            *) step="$CHOSEN" ;;
          esac
          echo "step=$step" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
          latest=$(git ls-remote --heads "$AIGENT" 'snap-*' | sed 's|.*refs/heads/||' | sort | tail -n 1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Snap
        if: steps.plan.outputs.step == 'snap'
        env:
          DATE: ${{ steps.plan.outputs.date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          under=$(.github/release/wait-for-ref.sh "refs/heads/snap-$DATE") || {
            echo "::error::underhood made no snap-$DATE, so aigent does not snap"
            exit 1
          }
          git checkout -B main origin/main
          pinned=$(.github/release/pin-underhood.sh "branch = \"snap-$DATE\"")
          if [ "$pinned" != "$under" ]; then
            echo "::error::locked underhood $pinned, not its snap-$DATE head $under"
            exit 1
          fi
          git commit -am "Point underhood at its snap-$DATE"
          git push "$AIGENT" main
          git push -f "$AIGENT" "main:refs/heads/snap-$DATE"
          gh workflow run checks.yml --ref "snap-$DATE"
          echo "main and snap-$DATE now run on underhood's snap-$DATE at $under"
          git ls-remote --heads "$AIGENT" 'snap-*' | sed 's|.*refs/heads/||' | sort | head -n "-$KEEP" |
            while read -r old; do git push "$AIGENT" --delete "$old"; echo "pruned $old"; done

      - name: Roll
        if: steps.plan.outputs.step == 'roll'
        env:
          DATE: ${{ steps.plan.outputs.date }}
          SNAP: ${{ steps.plan.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          under=$(.github/release/wait-for-ref.sh "refs/tags/roll-$DATE") || under=""
          git checkout -B main origin/main
          .github/release/pin-underhood.sh 'tag = "stable"' > /dev/null
          if git diff --quiet; then
            echo "main already runs on underhood's stable"
          else
            git commit -am "Point underhood back at its stable tag"
            git push "$AIGENT" main
            gh workflow run checks.yml --ref main
          fi
          if [ -z "$under" ]; then
            echo "::error::underhood did not roll, so aigent does not; main is back on underhood's last roll"
            exit 1
          fi
          sha=$(git ls-remote "$AIGENT" "refs/heads/$SNAP" | cut -f1)
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --jq \
            '[.check_runs[] | select(.name == "lint · types · tests")]
             | sort_by(.completed_at) | last | .conclusion // "missing"')
          if [ "$ci" != success ]; then
            echo "::error::CI on $SNAP's head $sha is $ci; aigent does not roll"
            exit 1
          fi
          if ! git show "$sha:uv.lock" | grep -q "#$under"; then
            echo "::error::$SNAP pins a different underhood than the $under that rolled; run repin, then roll"
            exit 1
          fi
          git tag -f "roll-$DATE" "$sha"
          git tag -f stable "$sha"
          git push -f "$AIGENT" "refs/tags/roll-$DATE" refs/tags/stable
          echo "rolled $SNAP at $sha with underhood $under as roll-$DATE, now stable"

      - name: Re-pin main and the latest snap to underhood's
        if: steps.plan.outputs.step == 'repin'
        env:
          SNAP: ${{ steps.plan.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in main "$SNAP"; do
            git checkout -B "$branch" "origin/$branch"
            uv lock --upgrade-package underhood
            if git diff --quiet uv.lock; then
              echo "$branch already pins underhood's latest"
              continue
            fi
            git commit -m "Re-pin underhood to its latest" uv.lock
            git push "$AIGENT" "$branch"
            gh workflow run checks.yml --ref "$branch"
          done
